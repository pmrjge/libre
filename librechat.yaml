version: "1.1.5"

cache: true

fileConfig:
  serverFileSizeLimit: 200
  avatarSizeLimit: 5

# Automated OCR Pipeline for images and unsearchable PDFs
ocr:
  strategy: "document_parser"
  supportedMimeTypes:
    - "image/png"
    - "image/jpeg"
    - "image/webp"
    - "application/pdf"

endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default:
          # Multi-Model Deliberation Ensembles
          - "openrouter/fusion"
          - "openrouter/fusion-flash"
        fetch: true
      titleConvo: true
      titleModel: "openrouter/fusion"
      dropParams:
        - "stop"
      summarize: true
      summaryModel: "openrouter/fusion"
      modelDisplayLabel: "OpenRouter"

mcpSettings:
  # Only needed if you later add internal/private MCP endpoints.
  allowedAddresses: []

mcpServers:

  fusion:
    type: stdio
    command: uvx
    args:
      - openrouter-fusion-agent
      - --mcp
    env:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    initTimeout: 120000
    timeout: 120000

  exa:
    type: streamable-http
    url: "https://mcp.exa.ai/mcp"
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${EXA_API_KEY}"
    initTimeout: 30000
    timeout: 120000

  jina:
    type: streamable-http
    url: "https://mcp.jina.ai/v1"
    requiresOAuth: false
    headers:
      Authorization: "Bearer ${JINA_API_KEY}"
    initTimeout: 30000
    timeout: 120000

  spider:
    type: stdio
    command: npx
    args:
      - -y
      - spider-cloud-mcp
    env:
      SPIDER_API_KEY: "${SPIDER_API_KEY}"
    initTimeout: 120000
    timeout: 120000

  docling:
    type: stdio
    command: uvx
    args:
      - --from
      - docling-mcp
      - docling-mcp-server
      - --transport
      - stdio
    initTimeout: 120000
    timeout: 120000

  filesystem:
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - /workspace
    initTimeout: 120000
    timeout: 120000

  memory:
    type: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-memory"

  # 1. PUPPETEER SERVER
  # Used by: wireframer-skill, responsive-craft, brand-to-design-md-skill
  # Capabilities: Headless browser automation, DOM inspection, taking screenshots for Vision
  puppeteer:
    command: "npx"
    args: 
      - "-y"
      - "@modelcontextprotocol/server-puppeteer"
      
  # 2. FETCH SERVER
  # Used by: google-fonts-skill
  # Capabilities: Making REST API calls to the Google Fonts Developer API
  fetch:
    command: "npx"
    args: 
      - "-y"
      - "@modelcontextprotocol/server-fetch"

  # 3. COLOR METRICS SERVER
  # Used by: color-expert-skill
  # Capabilities: WCAG contrast calculation, OKLCH conversion, palette generation
  color-server:
    command: "npx"
    args:
      - "-y"
      - "color-scheme-mcp" # Open-source community color MCP server

  # 5. BASH / COMMAND EXECUTION SERVER
  # Used by: ux-flow-designer, motion-design-skill
  # Capabilities: Running local linters, executing Mermaid CLI syntax validation
  bash-runner:
    command: "npx"
    args:
      - "-y"
      - "@snickell/mcp-server-bash"
