services:
  chat-mongodb:
    image: mongo:7.0.5
    container_name: chat-mongodb
    restart: always
    volumes:
      - chat-mongodb-data:/data/db
    command: mongod --noauth --replSet rs0 --bind_ip_all
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval "
          try {
            rs.status();
          } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'chat-mongodb:27017' }] });
          }
          if (!db.hello().isWritablePrimary) {
            quit(1);
          }
        "
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - chat-network

  meilisearch:
    image: getmeili/meilisearch:v1.12.0
    container_name: chat-meilisearch
    restart: always
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./data/meili:/meili_data
    networks:
      - chat-network

  api:
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    container_name: chat-librechat
    restart: always
    ports:
      - "3080:3080"
    depends_on:
      chat-mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://chat-mongodb:27017/LibreChat?replicaSet=rs0
      - MEILI_HOST=http://meilisearch:7700
      - SEARCH=true
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
      - ./images:/app/client/public/images
      - ./logs:/app/api/logs
      - ./workspace:/workspace
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge

volumes:
  chat-mongodb-data: